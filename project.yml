name: Locus
options:
  bundleIdPrefix: com.seanmcdonnell
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: V7Z23T9D5C
targets:
  Locus:
    type: application
    platform: iOS
    sources: [Locus]
    scheme:
      testTargets: [LocusUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seanmcdonnell.Locus
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Locus
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: Locus/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
    entitlements:
      path: Locus/Locus.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.seanmcdonnell.Locus]
        aps-environment: development
  LocusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LocusUITests]
    dependencies:
      - target: Locus
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.seanmcdonnell.LocusUITests
        TEST_TARGET_NAME: Locus
        CODE_SIGN_STYLE: Automatic
